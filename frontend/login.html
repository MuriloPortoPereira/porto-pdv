<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Vendas</title>
    <!-- Use FontAwesome for icons like the rest of the project -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
            margin: 0;
            padding: 1rem;
        }
        .login-container {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        .login-header {
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: var(--primary-color);
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color var(--transition-speed);
        }
        .form-control:focus {
            border-color: var(--primary-color);
        }
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }
        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
        }
        .error-message {
            color: var(--danger-color);
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none; /* Show when there is an error */
        }
        .internal-access-note {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-store"></i> Porto Works</h1>
            <p>Acesso restrito à equipe da loja</p>
        </div>

        <!-- O form aponta temporariamente para o dashboard de forma visual -->
        <form action="pages/dashboard.html" method="GET">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" class="form-control" placeholder="ex: admin@sistemavendas.com" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" class="form-control" placeholder="Sua senha" required>
            </div>

            <div class="login-options">
                <label class="checkbox-group">
                    <input type="checkbox" name="lembrar">
                    Lembrar-me
                </label>
                <a href="#" class="forgot-password">Esqueci minha senha</a>
            </div>

            <button type="submit" class="btn btn-primary">Entrar</button>

            <!-- Espaço reservado para mensagem de erro no futuro -->
            <div class="error-message">
                E-mail ou senha incorretos.
            </div>
        </form>

        <div class="internal-access-note">
            <i class="fas fa-lock"></i> Sistema de Vendas - Acesso Interno
        </div>
    </div>

</body>
</html>
